<style>

  --ok:#3fb67a;--sos:#e7b03b;--err:#e5534b;--sin:#6b778a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--tx);font:15px/1.45 Inter,system-ui,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column}
header{background:radial-gradient(900px 300px at 85% 0%,#163a73 0%,var(--noche) 62%);border-bottom:3px solid var(--oro);padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header img{height:32px}
.marca{display:flex;flex-direction:column;align-items:center;gap:2px}#relojUTC{font:700 15px/1 ui-monospace,Consolas,monospace;color:var(--oro);letter-spacing:.5px;white-space:nowrap}#relojUTC small{color:#9fb0cc;font-weight:600;font-size:11.5px}
header h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.01em}

main{flex:1;display:grid;grid-template-columns:minmax(320px,1.1fr) minmax(360px,1fr);gap:0;min-height:0}
#mapa{min-height:420px;background:#0d1a2e}
aside{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--bd)}
.tools{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--bd);flex-wrap:wrap;align-items:center}
.tools button{background:var(--panel);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 11px;font:600 13px inherit;cursor:pointer}
.tools button.on{border-color:var(--oro);color:var(--oro)}
.tools select{background:var(--panel);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font:600 13px inherit}

.vsel{position:relative}.vsel summary{list-style:none;background:var(--panel);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font:600 13px inherit;cursor:pointer;white-space:nowrap}
.vsel summary::-webkit-details-marker{display:none}.vsel[open] summary,.vsel.f summary{border-color:var(--oro);color:var(--oro)}
.vbox{position:absolute;z-index:1000;top:calc(100% + 4px);right:0;background:#0f1c3a;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;min-width:190px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.vbox label{display:flex;gap:8px;align-items:center;padding:4px 2px;font-size:13.5px;cursor:pointer}.tools .vbox input{flex:none;min-width:0;width:auto;margin:0;padding:0;accent-color:var(--oro)}
.vbox .vq{display:flex;gap:10px;border-bottom:1px solid var(--bd);padding-bottom:6px;margin-bottom:4px}.vbox .vq a{color:var(--oro);font-size:12.5px;cursor:pointer}
#lista{overflow:auto;flex:1}
.it{display:grid;grid-template-columns:12px 1fr auto;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd);cursor:pointer}
.it:hover,.it.sel{background:#16264a}

#minu{flex:1;overflow:auto;padding:14px 20px}#minu[hidden]{display:none}

#minu table{border-collapse:collapse;width:100%;font-size:13px}#minu th,#minu td{border-bottom:1px solid var(--bd);padding:4px 7px;text-align:left}#minu .mtab th{position:sticky;top:0;background:var(--panel)}#minu .mtab td{font-variant-numeric:tabular-nums}
#minu table.mtab{width:auto}#minu .mtab th,#minu .mtab td{padding:3px 12px;white-space:nowrap}#minu .mtab td:nth-child(n+3){text-align:right}#minu .mtab th{max-width:220px;white-space:normal;text-align:right}#minu .mtab th:nth-child(-n+2){text-align:left}
#minu details.mblo{margin:12px 0;border:1px solid var(--bd);border-radius:10px;background:#0d1a38}#minu details.mblo>summary{cursor:pointer;padding:8px 12px;font-weight:700;font-size:15px;list-style:none;display:flex;align-items:center;gap:8px}#minu details.mblo>summary::-webkit-details-marker{display:none}#minu details.mblo>summary::before{content:"▸";color:var(--oro);transition:transform .15s}#minu details.mblo[open]>summary::before{transform:rotate(90deg)}#minu details.mblo>summary:hover{color:var(--oro)}#minu .mcont{padding:0 12px 12px}
#minu tr.inc:hover{background:#16264a}#minu tr.vis{outline:2px solid var(--oro)}
#rell{flex:1;overflow:auto;padding:14px 20px}#rell[hidden]{display:none}
#rell .htools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}

#rell .hres{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}#rell .hres div{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;min-width:150px}

#rell table{border-collapse:collapse;width:100%;font-size:13px}#rell th,#rell td{border-bottom:1px solid var(--bd);padding:4px 7px;text-align:left}#rell .mtab th{position:sticky;top:0;background:var(--panel)}#rell .mtab td{font-variant-numeric:tabular-nums}
#rell table.mtab{width:auto}#rell .mtab th,#rell .mtab td{padding:3px 12px;white-space:nowrap}#rell .mtab td:nth-child(n+3){text-align:right}#rell .mtab th{max-width:220px;white-space:normal;text-align:right}#rell .mtab th:nth-child(-n+2){text-align:left}
#rell details.mblo{margin:12px 0;border:1px solid var(--bd);border-radius:10px;background:#0d1a38}#rell details.mblo>summary{cursor:pointer;padding:8px 12px;font-weight:700;font-size:15px;list-style:none;display:flex;align-items:center;gap:8px}#rell details.mblo>summary::-webkit-details-marker{display:none}#rell details.mblo>summary::before{content:"▸";color:var(--oro);transition:transform .15s}#rell details.mblo[open]>summary::before{transform:rotate(90deg)}#rell details.mblo>summary:hover{color:var(--oro)}#rell .mcont{padding:0 12px 12px}
#rell tr.inc:hover{background:#16264a}#rell tr.vis{outline:2px solid var(--oro)}
#rell .rcols{display:grid;grid-template-columns:1fr 440px;gap:12px;align-items:start}#rell .htools button.on{border-color:var(--oro);color:#10203f;background:var(--oro)}
#rell .ley{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mu);margin:4px 0 6px}#rell .ley i{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:5px}
#rell .rtip{position:absolute;background:#0A1F44;border:1px solid var(--oro);border-radius:8px;padding:7px 10px;font-size:12px;min-width:200px;pointer-events:none}#rell .rtip div{display:flex;justify-content:space-between;gap:10px}#rell .rtip span{color:var(--mu)}
#rell .rdias{display:flex;flex-wrap:wrap;gap:3px}#rell .rdias button{position:relative;width:30px;height:26px;border:1px solid #0000;border-radius:5px;color:#fff;font:700 11.5px inherit;cursor:pointer;padding:0}#rell .rdias button.on{outline:2px solid var(--oro);outline-offset:1px}#rell .rdias button i{position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:#fff}
#rell .rlista td{font-size:12.5px}#rell .mtab.rlista th,#rell .mtab.rlista td{text-align:left}
@media (max-width:1200px){#rell .rcols{grid-template-columns:1fr}}
#hist .htools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
#hist .htools input,#hist .htools select,#hist .htools button{background:var(--panel);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 9px;font:600 13px inherit}
#hist .htools button{cursor:pointer}#hist .htools label{color:var(--mu);font-size:13px}
#hist .hres{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}#hist .hres div{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:8px 14px}
#hist .hres b{display:block;font-size:20px}#hist .hres span{color:var(--mu);font-size:12.5px}
#hist .hcols{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:16px;align-items:start}
#hist .ab{color:#f2c94c;font-weight:700}#hist .co{color:#6fcf97;font-weight:700}#hist .rv{background:none;border:1px solid var(--bd);color:var(--mu);border-radius:6px;padding:2px 7px;font:600 12px inherit;cursor:pointer}
#hist .rv.on.r{background:#1f5a3a;border-color:#6fcf97;color:#fff}#hist .rv.on.f{background:#5a1f1f;border-color:#eb5757;color:#fff}
#hist tr.hs{cursor:pointer}#hist tr.hs:hover,#hist tr.hs.on{background:#16264a}
@media (max-width:900px){main{grid-template-columns:1fr}#mapa{height:55vh}aside{border-left:0}}
</style>

<body>
<header>
 <div class="marca"><a href="index.html"><img src="img/logo_blanco.svg" alt="METOTEC"></a><div id="relojUTC" title="Hora UTC (hora local entre paréntesis)">— UTC</div></div>
 <h1>Control de calidad en vivo<small id="hora">—</small></h1>
 <div class="modos"><button data-m="ema" class="on">Estaciones automáticas</button><button data-m="obs">Observaciones</button><button data-m="mod">Contraste con modelos</button><button data-m="prio">Prioridades</button><button data-m="hist">Historial</button><button data-m="minu">Datos minutarios</button><button data-m="rell">Completar serie</button></div>
 <div class="chips" id="chips"></div>
</header>
<main>
 <div id="mapa"></div>
 <aside>
  <div class="tools">
   <button data-z="todo" class="on">Todo</button><button data-z="norte">Norte</button><button data-z="centro">Centro</button><button data-z="sur">Sur</button><button data-z="austral">Austral</button>
   <select id="grupo" title="Pruebas"><option value="todas">Todas las pruebas</option><option value="basicas">Solo básicas</option><option value="vecinas">Solo vecinas</option><option value="modelos">Solo modelos</option><option value="lluvia">Solo lluvia</option><option value="satelite">Solo satélite</option><option value="incendio">Solo incendios cercanos</option></select>
   <details class="vsel" id="vars"><summary id="varsT">Variables: todas ▾</summary><div class="vbox" id="vbox"></div></details>
   <select id="gobs" title="Tipo de revisión" hidden><option value="todas">Todas las revisiones</option><option value="sistema">Reglas del sistema</option><option value="codificacion">Codificación</option><option value="evolucion">Evolución</option><option value="sensor">Frente al sensor</option><option value="satelite">Frente al satélite</option></select>
   <select id="mvar" title="Variable" hidden><option value="T">Temperatura</option><option value="Td">Punto de rocío</option><option value="HR">Humedad</option><option value="P_mar">QFF</option><option value="ff10">Viento</option></select>
   <select id="mref" title="Modelo" hidden><option value="w">WRF-DMC</option><option value="om">Open-Meteo</option><option value="prom">Promedio de ambos</option></select>
   <input id="buscar" placeholder="Buscar estación…">
  </div>
  <div id="lista"></div>
  <div id="det"></div>
 </aside>
</main>

<script>
(function(){ const r = document.getElementById("relojUTC");
  const t = () => { const d = new Date(); r.innerHTML = d.toISOString().slice(11, 19) + " UTC <small>(" + d.toLocaleTimeString("es-CL", {timeZone: "America/Santiago", hour: "2-digit", minute: "2-digit", hour12: false}) + " local)</small>"; };
  t(); setInterval(t, 1000); })();
</script>
<script>
const COL = {0: "var(--ok)", 1: "var(--sos)", 2: "var(--err)", 3: "var(--sin)"};
const HEX = {0: "#3fb67a", 1: "#e7b03b", 2: "#e5534b", 3: "#6b778a"};
const NOM = {0: "Bien", 1: "Sospechoso", 2: "Erróneo", 3: "Sin datos"};
const PR = {incendio: "Incendio cercano", rango: "Rango", salto: "Salto", pegado: "Valor pegado", coherencia: "Coherencia", vecinas: "Vecinas", modelo: "Open-Meteo", wrf: "WRF-DMC", lluvia: "Lluvia", satelite: "Satélite", completitud: "Completitud"};
const VARGR = [["T", "Temperatura", ["T", "Tn12", "Tx12"]], ["Td", "Punto de rocío", ["Td"]], ["HR", "Humedad", ["HR"]], ["P", "Presión", ["P_est", "P_mar", "P_std"]],
  ["V", "Viento", ["ff10", "dd10", "ff2", "dd2", "fx10"]], ["RR", "Precipitación", ["rr1m", "rr1h", "rr3h", "rr6", "rr24"]], ["Rad", "Radiación", ["Rad"]], ["C", "Completitud", ["registros"]]];
const VAR2G = Object.fromEntries(VARGR.flatMap(([k, , vs]) => vs.map(v => [v, k])));
let VSEL = new Set(VARGR.map(g => g[0]));
const GRUPOS = {todas: null, basicas: ["rango", "salto", "pegado", "coherencia", "completitud"], vecinas: ["vecinas"], modelos: ["modelo", "wrf"], lluvia: ["lluvia"], satelite: ["satelite"], incendio: ["incendio"]};
let grupo = "todas", modo = "ema", gobs = "todas";
const TIPO = {sistema: "Regla del sistema", codificacion: "Codificación", evolucion: "Evolución", sensor: "Frente al sensor", satelite: "Frente al satélite"};
function obsFiltradas(){
  const L = ((R.observaciones || {}).estaciones || []).map(e => { const h = gobs === "todas" ? e.hallazgos : e.hallazgos.filter(x => x.tipo === gobs);
    return {...e, hallazgos: h, nivel: Math.max(0, ...h.map(x => x.nivel))}; });
  const q = $("#buscar").value.trim().toLowerCase();
  return L.filter(e => e.lat != null && enZona(e) && ver[e.nivel] && (!q || (e.nombre || "").toLowerCase().includes(q) || e.codigo.includes(q) || (e.oaci || "").toLowerCase() === q));
}
function pintarObs(){
  const O = R.observaciones || {}, g = O.generado ? new Date(O.generado) : null;
  $("#hora").textContent = g ? `Observaciones de las últimas 12 horas · revisado ${g.toLocaleTimeString("es-CL", {hour: "2-digit", minute: "2-digit"})}` : "Todavía no hay revisión de observaciones";
  const T = ((O.estaciones) || []), res = [0, 0, 0];
  T.forEach(e => { const h = gobs === "todas" ? e.hallazgos : e.hallazgos.filter(x => x.tipo === gobs); res[Math.max(0, ...h.map(x => x.nivel))]++; });
  $("#chips").innerHTML = [0, 1, 2].map(n => `<span class="chip ${ver[n] ? "" : "off"}" data-n="${n}"><i style="background:${COL[n]}"></i>${["Sin hallazgos", "Con avisos", "Con errores"][n]} ${res[n]}</span>`).join("");
  $("#fuentes").textContent = "Fuente: observaciones de las estaciones con observador (DMC) · comparadas con la estación automática del mismo lugar";
  const V = obsFiltradas();
  Object.values(marcas).forEach(m => m.remove()); marcas = {};
  V.forEach(e => { const m = L.circleMarker([e.lat, e.lon], {radius: 8, color: "#fff", weight: 1, fillColor: HEX[e.nivel], fillOpacity: .95}).addTo(mapa);
    m.bindTooltip(`${esc(e.nombre)} · ${e.hallazgos.length} hallazgos`); m.on("click", () => detalleObs(e.codigo)); marcas[e.codigo] = m; });
  const cuenta = h => Object.entries(h.reduce((a, x) => (a[x.tipo] = (a[x.tipo] || 0) + 1, a), {}));

/* ---------- prioridades ---------- */
let pEst = "";
async function firma(cod){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(clave() + "|" + cod));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("").slice(0, 16);
}
function pintarPrio(){
  if (!R) return;

  $("#hora").textContent = g ? `Prioridades · observaciones de las últimas 12 horas · revisado ${g.toLocaleTimeString("es-CL", {hour: "2-digit", minute: "2-digit"})}` : "Todavía no hay revisión de observaciones";
  if (!$("#prio").dataset.ok){
    $("#prio").dataset.ok = 1;
    $("#prio").innerHTML = `<div class="htools"><button id="pVolver" style="border-color:var(--oro);color:var(--oro)">← Volver al mapa</button><select id="pNivel"><option value="0">Todas las prioridades</option><option value="3">Solo alta</option><option value="2">Alta y media</option></select><input id="pBuscar" placeholder="Estación…" style="min-width:180px"></div>
      <p class="nota">Orden: primero los errores de lo que se transmite en SYNOP/METAR (presión, viento, visibilidad, tiempo presente), luego el resto; dentro de cada nivel, lo más reciente. Con <b>Copiar enlace</b> el observador ve solo los pendientes de su estación, en este mismo orden, sin clave.</p>
      <div class="pcols"><div id="pEst"></div><div id="pTab"></div></div>`;
    $("#pVolver").addEventListener("click", () => document.querySelector('.modos button[data-m="ema"]').click());
    $("#pNivel").addEventListener("change", pintarPrio); $("#pBuscar").addEventListener("input", pintarPrio);
    $("#prio").addEventListener("click", async ev => {
      const b = ev.target.closest(".lk");
      if (b){ ev.stopPropagation(); const url = `${location.origin}/pendientes.html?e=${b.dataset.c}&k=${await firma(b.dataset.c)}`;
        try { await navigator.clipboard.writeText(url); b.textContent = "¡Copiado!"; } catch (e) { prompt("Enlace para el observador:", url); } setTimeout(() => b.textContent = "Copiar enlace", 1800); return; }
      const t = ev.target.closest("tr.ps"); if (t){ pEst = pEst === t.dataset.c ? "" : t.dataset.c; pintarPrio(); }
    });
  }
  const min = +$("#pNivel").value, q = $("#pBuscar").value.trim().toLowerCase();
  const E = (O.estaciones || []).filter(e => !q || (e.nombre || "").toLowerCase().includes(q) || e.codigo.includes(q));
  const todos = E.flatMap(e => ordenar(e.hallazgos).map(h => ({...h, nombre: e.nombre}))).filter(h => h.prio >= min);
  const L2 = todos.sort((a, b) => b.puntos - a.puntos || b.hora.localeCompare(a.hora));
  const por = E.map(e => { const H = ordenar(e.hallazgos).filter(h => h.prio >= min); return {c: e.codigo, n: e.nombre, t: H.length, a: H.filter(h => h.prio === 3).length}; })
    .sort((a, b) => b.a - a.a || b.t - a.t);
  $("#pEst").innerHTML = `<table><tr><th>Estación</th><th>Alta</th><th>Total</th><th></th></tr>${por.map(p => `<tr class="ps ${pEst === p.c ? "on" : ""}" data-c="${p.c}"><td>${esc(p.n)}</td><td style="color:${p.a ? PRIO_COL[3] : "inherit"};font-weight:700">${p.a}</td><td>${p.t}</td><td><button class="lk" data-c="${p.c}">Copiar enlace</button></td></tr>`).join("")}</table>`;
  const T = L2.filter(h => !pEst || h.codigo === pEst);
  $("#pTab").innerHTML = T.length ? `<table><tr><th>#</th><th>Prioridad</th><th>Día y hora UTC</th><th>Estación</th><th>Elemento</th><th>Regla</th><th>Detalle</th></tr>${T.map((h, i) => `<tr><td>${i + 1}</td><td><span class="pb" style="background:${PRIO_COL[h.prio]}">${h.prioNom}</span></td>
    <td style="white-space:nowrap">${h.hora.slice(8, 10)}/${h.hora.slice(5, 7)} ${h.hora.slice(11, 16)}</td><td>${esc(h.nombre)}</td><td>${esc(h.elem)}</td><td>${esc(h.regla)}</td><td>${esc(h.msg)}</td></tr>`).join("")}</table>`
    : `<p style="color:var(--mu)">Sin pendientes con ese filtro.</p>`;
}

async function hCargar(){
  $("#hTab").innerHTML = `<p style="color:var(--mu)">Cargando…</p>`;
  const r = await fetch(`/api/historial?desde=${$("#hDesde").value}&hasta=${$("#hHasta").value}`, {headers: {"x-clave": clave()}, cache: "no-store"});

function hFilas(){

  return L;
}
async function revisar(dia, id, v){
  const r = await fetch("/api/revision", {method: "POST", headers: {"x-clave": clave(), "content-type": "application/json"}, body: JSON.stringify({dia, id, v})});
  if (!r.ok) return alertaTxt("No se pudo guardar la revisión.");
  HI.revisiones = HI.revisiones || {}; const R = HI.revisiones[dia] = HI.revisiones[dia] || {};

function alertaTxt(t){ $("#hRes").insertAdjacentHTML("afterbegin", `<div style="border-color:#eb5757"><span>${t}</span></div>`); }
function hTipos(){

function hSel(){

  const tablaP = Object.keys(porP).length ? `<h3 style="font-size:13px;margin:16px 0 6px;color:var(--mu)">DESEMPEÑO POR ${obs ? "REGLA" : "PRUEBA"} (avisos revisados)</h3><table><tr><th>${obs ? "Regla" : "Prueba"}</th><th>Revisados</th><th>Aciertos</th></tr>${Object.entries(porP).sort((a, b) => b[1].n - a[1].n).map(([k, q]) => `<tr><td>${esc(k)}</td><td>${q.n}</td><td style="color:${q.r / q.n >= .7 ? "#6fcf97" : q.r / q.n >= .4 ? "#f2c94c" : "#eb5757"};font-weight:700">${Math.round(100 * q.r / q.n)} %</td></tr>`).join("")}</table>` : "";
  $("#hEst").innerHTML = `<table><tr><th>Estación</th><th>Total</th>${obs ? "<th>Abiertos</th>" : ""}</tr>${PE.map(p => `<tr class="hs ${hEst === p.c ? "on" : ""}" data-c="${p.c}"><td>${esc(p.n)}</td><td>${p.t}</td>${obs ? `<td class="${p.a ? "ab" : ""}">${p.a}</td>` : ""}</tr>`).join("")}</table>` + tablaP;

    + T.slice(0, MAX).map(x => `<tr><td style="white-space:nowrap">${(x.hora || x.momento).slice(8, 10)}/${(x.hora || x.momento).slice(5, 7)} ${(x.hora || x.momento).slice(11, 16)}</td><td>${esc(x.nombre || x.codigo)}</td>

      <td style="white-space:nowrap">${obs ? (x.estado === "corregido" ? `<span class="co">corregido</span><br><small style="color:var(--mu)">${x.corregido.slice(8, 10)}/${x.corregido.slice(5, 7)} ${x.corregido.slice(11, 16)} UTC</small>` : `<span class="ab">abierto</span>`) : (x.n + (x.n === 1 ? " pasada" : " pasadas"))}</td>
      <td style="white-space:nowrap"><button class="rv ${x._rev === "real" ? "on r" : ""}" data-d="${x._dia}" data-i="${esc(x._id)}" data-v="real" title="Era un error real">✓ real</button> <button class="rv ${x._rev === "falsa" ? "on f" : ""}" data-d="${x._dia}" data-i="${esc(x._id)}" data-v="falsa" title="Falsa alarma">✗ falsa</button></td></tr>`).join("") + `</table>`

function hResumen(){

  const fmt = n => n.toLocaleString("es-CL");

  const ab = O.filter(h => h.estado === "abierto"), co = O.filter(h => h.estado === "corregido");
  const tiempos = co.map(h => (Date.parse(h.corregido.replace(" ", "T") + ":00Z") - Date.parse(h.primera.replace(" ", "T") + ":00Z")) / 60000).filter(x => x >= 0).sort((a, b) => a - b);
  const med = tiempos.length ? tiempos[Math.floor(tiempos.length / 2)] : null;
  const top = (L, k, n = 5) => { const c = {}; L.forEach(h => { const v = k(h); c[v] = (c[v] || 0) + 1; }); return Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, n); };
  const tipo = h => TIPO[h.tipo] || h.tipo, prue = h => PR[h.prueba] || h.prueba;
  const rv = O.concat(A).filter(h => h._rev), re = rv.filter(h => h._rev === "real").length;
  const lin = [
    `Control de calidad · ${HI.desde} a ${HI.hasta}`,
    ``,
    `OBSERVACIONES (33 estaciones con observador)`,
    `- ${fmt(O.length)} hallazgos: ${fmt(co.length)} corregidos (${O.length ? Math.round(100 * co.length / O.length) : 0} %) y ${fmt(ab.length)} abiertos.`,
    med != null ? `- Tiempo mediano hasta la corrección: ${med < 60 ? Math.round(med) + " min" : (med / 60).toFixed(1) + " h"}.` : `- Sin correcciones registradas en el período.`,
    `- Estaciones con más hallazgos: ${top(O, h => h.nombre || h.codigo).map(([k, v]) => `${k} (${v})`).join(", ") || "—"}.`,
    `- Por tipo: ${top(O, tipo, 6).map(([k, v]) => `${k} ${v}`).join(" · ") || "—"}.`,
    `- Reglas más frecuentes: ${top(O, h => h.regla).map(([k, v]) => `${k} (${v})`).join(", ") || "—"}.`,
    ``,
    `ESTACIONES AUTOMÁTICAS`,
    `- ${fmt(A.length)} avisos en ${new Set(A.map(h => h.codigo)).size} estaciones.`,
    `- Por prueba: ${top(A, prue, 8).map(([k, v]) => `${k} ${v}`).join(" · ") || "—"}.`,
    `- Estaciones con más avisos: ${top(A, h => h.nombre || h.codigo).map(([k, v]) => `${k} (${v})`).join(", ") || "—"}.`,
    ``,
    rv.length ? `DESEMPEÑO: ${rv.length} avisos revisados a mano, ${Math.round(100 * re / rv.length)} % fueron errores reales.` : `DESEMPEÑO: aún no hay avisos revisados a mano.`,
  ];
  const txt = lin.join("\n");
  $("#hInf").hidden = false;
  $("#hInf").innerHTML = `<pre style="white-space:pre-wrap;font:13.5px/1.5 inherit;margin:0">${esc(txt)}</pre><button id="hCopiar" style="margin-top:8px">Copiar texto</button>`;
  $("#hCopiar").onclick = async () => { try { await navigator.clipboard.writeText(txt); $("#hCopiar").textContent = "¡Copiado!"; } catch (e) { prompt("Copie el resumen:", txt); } };
}
function hCsv(){

  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], {type: "text/csv"})); a.download = `historial_qc_${HI.desde}_${HI.hasta}.csv`; a.click();
}
$("#fl").addEventListener("submit", ev => { ev.preventDefault(); const c = $("#clave").value; try { sessionStorage.setItem("qcClave", c); } catch (e) { window._qc = c; } $("#lerr").textContent = ""; cargar(); });
// metotec.cl/modelo: solo el contraste con modelos (para presentar)
const VISTA0 = new URLSearchParams(location.search).get("vista");
if (["obs", "prio", "hist", "mod", "minu", "rell"].includes(VISTA0)) document.querySelector(`.modos button[data-m="${VISTA0}"]`).click();
if (/^\/modelo/.test(location.pathname) || new URLSearchParams(location.search).get("vista") === "modelo"){
  document.querySelector('.modos button[data-m="mod"]').click(); document.querySelector(".modos").style.display = "none";
  document.querySelector("header h1").firstChild.textContent = "Control de calidad · contraste con modelos"; document.title = "Contraste con modelos · METOTEC";
}
