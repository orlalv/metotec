    hoja("Resueltas en la ventana", res.map(r => ({Zona: zonaCod(r.codigo), "Estación": r.nombre, "Código": r.codigo, Sensor: FALLAS.sensor(r), Falla: FALLAS.que(r), "Inicio UTC": r.inicio, "Fin UTC": r.fin, "Duración (min)": Math.round(mn(r))})));
    hoja("Sin datos", sin.map(e => ({Zona: e.zona, "Estación": e.nombre, "Código": e.codigo})));
    hoja("Incompletos", inc.map(e => ({Zona: e.zona, "Estación": e.nombre, "Código": e.codigo, "Completitud %": e.completitud})));
    XLSX.writeFile(wb, `informe_red_ema_${hoy}.xlsx`);
  };
}

/* ---------- historial ---------- */
let HI = null, hEst = "";
const diaISO = d => d.toISOString().slice(0, 10);
function hInit(){
  if ($("#hist").dataset.ok) return; $("#hist").dataset.ok = 1;
  const hoy = new Date(), des = new Date(hoy - 6 * 864e5);
  $("#hist").innerHTML = `<div class="htools"><button id="hVolver" style="border-color:var(--oro);color:var(--oro)">← Volver al mapa</button><label>Desde</label><input type="date" id="hDesde" value="${diaISO(des)}"><label>Hasta</label><input type="date" id="hHasta" value="${diaISO(hoy)}">
    <select id="hFuente"><option value="obs">Observaciones</option><option value="ema">Estaciones automáticas</option><option value="inf">Fallas informadas</option></select>
    <select id="hEstado"><option value="">Todos los estados</option><option value="abierto">Abiertos</option><option value="corregido">Corregidos</option></select>
    <select id="hTipo"><option value="">Todos los tipos</option></select>
    <input id="hBuscar" placeholder="Estación o regla…" style="min-width:180px"><button id="hCargar">Actualizar</button><button id="hCsv">Descargar CSV</button><button id="hResumen" style="border-color:var(--oro);color:var(--oro)">Resumen para informe</button></div>
    <div id="hInf" hidden style="background:var(--panel);border:1px solid var(--oro);border-radius:10px;padding:12px 14px;margin-bottom:12px"></div>
    <div class="hres" id="hRes"></div><div class="hcols"><div id="hEst"></div><div id="hTab"></div></div>`;
  ["hFuente", "hEstado", "hTipo"].forEach(i => $("#" + i).addEventListener("change", () => { if (i === "hFuente") hTipos(); hPintar(); }));
  $("#hVolver").addEventListener("click", () => document.querySelector('.modos button[data-m="ema"]').click());
  $("#hBuscar").addEventListener("input", hPintar); $("#hCargar").addEventListener("click", hCargar); $("#hCsv").addEventListener("click", hCsv); $("#hResumen").addEventListener("click", hResumen);
  $("#hDesde").addEventListener("change", hCargar); $("#hHasta").addEventListener("change", hCargar);
  $("#hist").addEventListener("click", ev => { const b = ev.target.closest(".rv"); if (b){ revisar(b.dataset.d, b.dataset.i, b.classList.contains("on") ? "" : b.dataset.v); return; }
    const t = ev.target.closest("tr.hs"); if (t){ hEst = hEst === t.dataset.c ? "" : t.dataset.c; hPintar(); } });
}
async function hCargar(){
  $("#hTab").innerHTML = `<p style="color:var(--mu)">Cargando…</p>`;
  const r = await fetch(`/api/historial?desde=${$("#hDesde").value}&hasta=${$("#hHasta").value}`, {headers: {"x-clave": clave()}, cache: "no-store"});
  if (r.status === 401){ $("#login").style.display = "flex"; return; }
  HI = r.ok ? await r.json() : {dias: {}}; hTipos(); hPintar();
}
function hFilas(){
  const f = $("#hFuente").value, L = [], RV = HI.revisiones || {};
  if (f === "inf") return Object.entries(HI.informados || {}).map(([k, r]) => ({...r, _id: k, hora: r.inicio, estado: r.fin ? "resuelto" : "abierto"}));
  Object.entries(HI.dias).forEach(([dia, d]) => Object.entries(d[f] || {}).forEach(([id, x]) => L.push({...x, _id: id, _dia: dia, _rev: ((RV[dia] || {})[id] || {}).v, _quien: ((RV[dia] || {})[id] || {}).quien})));
  return L;
}
async function revisar(dia, id, v){
  const r = await fetch("/api/revision", {method: "POST", headers: {"x-clave": clave(), "content-type": "application/json"}, body: JSON.stringify({dia, id, v})});
  if (!r.ok) return alertaTxt("No se pudo guardar la revisión.");
  HI.revisiones = HI.revisiones || {}; const R = HI.revisiones[dia] = HI.revisiones[dia] || {};
  if (v) R[id] = {v}; else delete R[id];
  hPintar();
}
function alertaTxt(t){ $("#hRes").insertAdjacentHTML("afterbegin", `<div style="border-color:#eb5757"><span>${t}</span></div>`); }
function hTipos(){
  const f = $("#hFuente").value, cur = $("#hTipo").value;
  const ks = [...new Set(hFilas().map(x => f === "obs" ? x.tipo : x.prueba))];
  $("#hTipo").innerHTML = `<option value="">Todos los tipos</option>` + ks.map(k => `<option value="${k}">${(f === "obs" ? TIPO[k] : PR[k]) || k}</option>`).join("");
  if (ks.includes(cur)) $("#hTipo").value = cur;
  $("#hEstado").disabled = f !== "obs"; $("#hTipo").disabled = f === "inf";
}
function hSel(){
  if (!HI) return [];
  const f = $("#hFuente").value, es = $("#hEstado").value, ti = $("#hTipo").value, q = $("#hBuscar").value.trim().toLowerCase();
  return hFilas().filter(x => (f !== "obs" || !es || x.estado === es) && (!ti || (f === "obs" ? x.tipo : x.prueba) === ti)
    && (!q || (x.nombre || "").toLowerCase().includes(q) || x.codigo.includes(q) || String(x.regla || x.var || "").toLowerCase() === q));
}
function hPintar(){
  if (!HI) return;
  const f = $("#hFuente").value, S = hSel(), obs = f === "obs";
  if (f === "inf"){
    const fin = S.filter(x => x.fin), mn = x => (Date.parse((x.fin || x.ultima).replace(" ", "T") + ":00Z") - Date.parse(x.inicio.replace(" ", "T") + ":00Z")) / 60e3 + 1;
    $("#hRes").innerHTML = `<div><b>${S.length}</b><span>fallas informadas (últimos 2 meses)</span></div><div><b class="co">${fin.length}</b><span>resueltas</span></div><div><b class="ab">${S.length - fin.length}</b><span>siguen</span></div>`;
    $("#hEst").innerHTML = "";
    $("#hTab").innerHTML = S.length ? `<table><tr><th>Estación</th><th>Sensor</th><th>Falla</th><th>Inicio UTC</th><th>Fin UTC</th><th>Duración</th><th>Informada</th></tr>${S.sort((a, b) => b.inicio.localeCompare(a.inicio)).map(x => `<tr><td>${esc(x.nombre || x.codigo)}</td><td>${esc(FALLAS.sensor(x))}</td><td>${esc(FALLAS.que(x))}</td><td>${esc(x.inicio)}</td><td>${x.fin ? esc(x.fin) : "<span class='ab'>sigue</span>"}</td><td>${FALLAS.dur(mn(x))}</td><td>${esc((x.t || "").slice(0, 16).replace("T", " "))}</td></tr>`).join("")}</table>` : `<p style="color:var(--mu)">Aún no hay fallas informadas.</p>`;
    return;
  }
  const ab = S.filter(x => x.estado === "abierto").length, co = S.filter(x => x.estado === "corregido").length;
  $("#hRes").innerHTML = `<div><b>${S.length}</b><span>hallazgos ${HI.desde} a ${HI.hasta}</span></div>` + (obs ? `<div><b class="ab">${ab}</b><span>abiertos</span></div><div><b class="co">${co}</b><span>corregidos</span></div>` : "")
    + `<div><b>${new Set(S.map(x => x.codigo)).size}</b><span>estaciones</span></div>`
    + (() => { const rv = S.filter(x => x._rev && x._rev !== "omitir"), re = rv.filter(x => x._rev === "real").length;
        return `<div><b>${rv.length ? Math.round(100 * re / rv.length) + " %" : "—"}</b><span>aciertos (${rv.length} revisados: ${re} reales, ${rv.length - re} falsas alarmas)</span></div>`; })();
  const por = {}; S.forEach(x => { const p = por[x.codigo] ||= {c: x.codigo, n: x.nombre || x.codigo, t: 0, a: 0}; p.t++; if (x.estado === "abierto") p.a++; });
  const PE = Object.values(por).sort((a, b) => b.t - a.t);
  const porP = {}; S.filter(x => x._rev && x._rev !== "omitir").forEach(x => { const k = obs ? (x.regla || x.tipo) : (PR[x.prueba] || x.prueba); const q = porP[k] ||= {n: 0, r: 0}; q.n++; if (x._rev === "real") q.r++; });
  const tablaP = Object.keys(porP).length ? `<h3 style="font-size:13px;margin:16px 0 6px;color:var(--mu)">DESEMPEÑO POR ${obs ? "REGLA" : "PRUEBA"} (avisos revisados)</h3><table><tr><th>${obs ? "Regla" : "Prueba"}</th><th>Revisados</th><th>Aciertos</th></tr>${Object.entries(porP).sort((a, b) => b[1].n - a[1].n).map(([k, q]) => `<tr><td>${esc(k)}</td><td>${q.n}</td><td style="color:${q.r / q.n >= .7 ? "#6fcf97" : q.r / q.n >= .4 ? "#f2c94c" : "#eb5757"};font-weight:700">${Math.round(100 * q.r / q.n)} %</td></tr>`).join("")}</table>` : "";
  $("#hEst").innerHTML = `<table><tr><th>Estación</th><th>Total</th>${obs ? "<th>Abiertos</th>" : ""}</tr>${PE.map(p => `<tr class="hs ${hEst === p.c ? "on" : ""}" data-c="${p.c}"><td>${esc(p.n)}</td><td>${p.t}</td>${obs ? `<td class="${p.a ? "ab" : ""}">${p.a}</td>` : ""}</tr>`).join("")}</table>` + tablaP;
  const T = S.filter(x => !hEst || x.codigo === hEst).sort((a, b) => (b.hora || b.momento).localeCompare(a.hora || a.momento) || a.nombre?.localeCompare(b.nombre || ""));
  const MAX = 1500;
  $("#hTab").innerHTML = T.length ? `<table><tr><th>Día y hora UTC</th><th>Estación</th><th>${obs ? "Tipo" : "Prueba"}</th><th>${obs ? "Regla" : "Variable"}</th><th>Detalle</th><th>${obs ? "Estado" : "Visto"}</th><th>Revisión</th></tr>`
    + T.slice(0, MAX).map(x => `<tr><td style="white-space:nowrap">${(x.hora || x.momento).slice(8, 10)}/${(x.hora || x.momento).slice(5, 7)} ${(x.hora || x.momento).slice(11, 16)}</td><td>${esc(x.nombre || x.codigo)}</td>
      <td style="color:${HEX[x.nivel] || "inherit"}">${obs ? TIPO[x.tipo] || x.tipo : PR[x.prueba] || x.prueba}</td><td>${obs ? REGLAS.html(x.regla, esc) : VAR[x.var] || x.var}</td><td>${esc(x.msg)}${obs && SGRAF.tiene(x.regla) ? ` <button class="sgbtn" data-sg="${esc(x.hora)}|${esc(x.regla)}|${esc(x.codigo)}" data-msg="${esc(x.msg)}">${SGRAF.etiqueta(x.regla)}</button>` : ""}</td>
      <td style="white-space:nowrap">${obs && x._rev === "resuelto" && x.estado !== "corregido" ? `<span class="co" title="Marcado a mano como resuelto">resuelto (a mano)</span>` : ""}${x._rev === "omitir" ? `<span class="co" title="Archivada a mano: no vuelve a salir para esta estación, hora y regla">omitida</span><br>` : ""}${obs ? (x.estado === "corregido" ? `<span class="co" title="Marcado por el sistema: en una revisión posterior la observación se volvió a leer desde SACLIM y ya no falla (el dato se modificó, llegó el minutario que faltaba o cambió la regla)">corregido</span><br><small style="color:var(--mu)">${x.corregido.slice(8, 10)}/${x.corregido.slice(5, 7)} ${x.corregido.slice(11, 16)} UTC</small>` : `<span class="ab">abierto</span>`) : (x.n + (x.n === 1 ? " pasada" : " pasadas"))}</td>
      <td style="white-space:nowrap"><button class="rv ${x._rev === "real" ? "on r" : ""}" data-d="${x._dia}" data-i="${esc(x._id)}" data-v="real" title="Era un error real">✓ real</button>${x._quien ? ` <small style="color:var(--mu)">${esc(x._quien)}</small>` : ""} <button class="rv ${x._rev === "falsa" ? "on f" : ""}" data-d="${x._dia}" data-i="${esc(x._id)}" data-v="falsa" title="Falsa alarma">✗ falsa</button></td></tr>`).join("") + `</table>`
    + (T.length > MAX ? `<p style="color:var(--mu)">Se muestran ${MAX} de ${T.length}; descargue el CSV para verlos todos.</p>` : "")
    : `<p style="color:var(--mu)">Sin hallazgos guardados con ese filtro. El historial se empezó a guardar el 8 de noviembre de 2026.</p>`;
}
function hResumen(){
  if (!HI) return;
  const fmt = n => n.toLocaleString("es-CL");
  const O = []; const A = []; const RV = HI.revisiones || {};
  Object.entries(HI.dias).forEach(([d, x]) => { Object.entries(x.obs || {}).forEach(([id, h]) => O.push({...h, _rev: ((RV[d] || {})[id] || {}).v})); Object.values(x.ema || {}).forEach(h => A.push(h)); });
  const ab = O.filter(h => h.estado === "abierto"), co = O.filter(h => h.estado === "corregido");
  const tiempos = co.map(h => (Date.parse(h.corregido.replace(" ", "T") + ":00Z") - Date.parse(h.primera.replace(" ", "T") + ":00Z")) / 60000).filter(x => x >= 0).sort((a, b) => a - b);
  const med = tiempos.length ? tiempos[Math.floor(tiempos.length / 2)] : null;
  const top = (L, k, n = 5) => { const c = {}; L.forEach(h => { const v = k(h); c[v] = (c[v] || 0) + 1; }); return Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, n); };
  const tipo = h => TIPO[h.tipo] || h.tipo, prue = h => PR[h.prueba] || h.prueba;
  const rv = O.concat(A).filter(h => h._rev && h._rev !== "omitir"), re = rv.filter(h => h._rev === "real").length;
  const lin = [
    `Control de calidad · ${HI.desde} a ${HI.hasta}`,
    ``,
    `OBSERVACIONES (33 estaciones con observador)`,
    `- ${fmt(O.length)} hallazgos: ${fmt(co.length)} corregidos (${O.length ? Math.round(100 * co.length / O.length) : 0} %) y ${fmt(ab.length)} abiertos.`,
    med != null ? `- Tiempo mediano hasta la corrección: ${med < 60 ? Math.round(med) + " min" : (med / 60).toFixed(1) + " h"}.` : `- Sin correcciones registradas en el período.`,
    `- Estaciones con más hallazgos: ${top(O, h => h.nombre || h.codigo).map(([k, v]) => `${k} (${v})`).join(", ") || "—"}.`,
    `- Por tipo: ${top(O, tipo, 6).map(([k, v]) => `${k} ${v}`).join(" · ") || "—"}.`,
    `- Reglas más frecuentes: ${top(O, h => h.regla).map(([k, v]) => `${k} (${v})`).join(", ") || "—"}.`,
    ``,
    `ESTACIONES AUTOMÁTICAS`,
    `- ${fmt(A.length)} avisos en ${new Set(A.map(h => h.codigo)).size} estaciones.`,
    `- Por prueba: ${top(A, prue, 8).map(([k, v]) => `${k} ${v}`).join(" · ") || "—"}.`,
    `- Estaciones con más avisos: ${top(A, h => h.nombre || h.codigo).map(([k, v]) => `${k} (${v})`).join(", ") || "—"}.`,
    ``,
    rv.length ? `DESEMPEÑO: ${rv.length} avisos revisados a mano, ${Math.round(100 * re / rv.length)} % fueron errores reales.` : `DESEMPEÑO: aún no hay avisos revisados a mano.`,
  ];
  const txt = lin.join("\n");
  $("#hInf").hidden = false;
  $("#hInf").innerHTML = `<pre style="white-space:pre-wrap;font:13.5px/1.5 inherit;margin:0">${esc(txt)}</pre><button id="hCopiar" style="margin-top:8px">Copiar texto</button>`;
  $("#hCopiar").onclick = async () => { try { await navigator.clipboard.writeText(txt); $("#hCopiar").textContent = "¡Copiado!"; } catch (e) { prompt("Copie el resumen:", txt); } };
}
function hCsv(){
  const obs = $("#hFuente").value === "obs", S = hSel().filter(x => !hEst || x.codigo === hEst);
  const cols = obs ? ["hora", "codigo", "nombre", "tipo", "regla", "nivel", "msg", "estado", "primera", "ultima", "corregido"] : ["momento", "codigo", "nombre", "prueba", "var", "nivel", "valor", "ref", "msg", "primera", "ultima", "n"];
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const txt = "\ufeff" + cols.join(";") + "\n" + S.map(x => cols.map(c => q(x[c])).join(";")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], {type: "text/csv"})); a.download = `historial_qc_${HI.desde}_${HI.hasta}.csv`; a.click();
}
$("#fl").addEventListener("submit", ev => { ev.preventDefault(); const c = $("#clave").value; try { sessionStorage.setItem("qcClave", c); } catch (e) { window._qc = c; } $("#lerr").textContent = ""; cargar(); });

const HASH0 = decodeURIComponent((location.hash || "").slice(1));
