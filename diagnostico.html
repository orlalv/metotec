<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnóstico · Tiempo presente</title>
<style>
:root{--nav:#121b2b;--fondo:#eef2f5;--tx:#1b2533;--mu:#5d6b7e;--ac:#e07b39;--ok:#1e6b43;--okb:#ddf1e5;--bad:#a93226;--badb:#f8dedb;--bd:#d5dde7;--az:#1f4f93}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--tx);font:16px/1.5 system-ui,"Segoe UI",Roboto,Arial,sans-serif}
.top{background:var(--nav);color:#fff;padding:14px 16px}
.top .k{color:var(--ac);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.top h1{margin:2px 0 0;font-size:22px}
.top .tm{float:right;font:700 18px ui-monospace,Consolas,monospace;color:#c9d3e0}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:16px 18px;margin:0 0 14px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
label{display:block;font-weight:600;margin:10px 0 4px}
input[type=text]{width:100%;font:inherit;padding:9px 11px;border:1px solid #9fb0c3;border-radius:7px}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;background:var(--nav);color:#fff;padding:10px 18px;cursor:pointer}
.btn.or{background:var(--ac)}.btn:disabled{opacity:.45;cursor:default}
.btn.sec{background:#fff;color:var(--tx);border:1px solid #9fb0c3}
.nav{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap}
.prog{height:6px;background:#dbe2ea;border-radius:3px;overflow:hidden;margin:4px 0 14px}.prog i{display:block;height:100%;background:var(--ac)}
.q{font-size:18px;font-weight:600;margin:4px 0 12px}
.code{font:700 22px ui-monospace,Consolas,"Courier New",monospace;background:#e7edf4;border-radius:8px;padding:6px 14px;display:inline-block;margin:2px 0 10px}
.op{display:block;width:100%;text-align:left;font:inherit;background:#fff;border:1.5px solid var(--bd);border-radius:9px;padding:11px 14px;margin:0 0 8px;cursor:pointer}
.op:hover{border-color:#9fb0c3}.op.sel{border-color:var(--ac);background:#fff6ef;font-weight:600}
.mu{color:var(--mu);font-size:14px}
.big{font-size:34px;font-weight:800;line-height:1.1}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.res div{background:#f5f7fa;border-radius:8px;padding:10px}
.it{border-top:1px solid #e4e9ef;padding:10px 0}
.it .ok{color:var(--ok);font-weight:700}.it .bad{color:var(--bad);font-weight:700}
.estado{font-size:14px;margin-top:8px}
@media (max-width:560px){.res{grid-template-columns:1fr 1fr}.top h1{font-size:19px}}
</style>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
</head>
<body>
<div class="top"><span class="tm" id="tm"></span><div class="k">Diagnóstico · antes de la clase</div><h1>Tiempo presente METAR y SYNOP</h1></div>
<main id="app"></main>
<script src="api.js"></script>
<script>
// Preguntas: [texto, código (opcional), opciones, índice correcto, explicación, tema]
const P = [
 ["¿Existe este grupo de tiempo presente?", "+TSGR", ["Sí, existe", "No existe"], 0, "Tormenta con granizo fuerte: el + es de la precipitación.", "Combinaciones"],
 ["¿Existe este grupo de tiempo presente?", "-BR", ["Sí, existe", "No existe"], 1, "La neblina no lleva intensidad: su densidad la dice la visibilidad.", "Intensidad"],
 ["¿Existe este grupo de tiempo presente?", "DRSN", ["Sí, existe", "No existe"], 0, "Ventisca baja de nieve: sin intensidad.", "Descriptores"],
 ["¿Existe este grupo de tiempo presente?", "VCRA", ["Sí, existe", "No existe"], 1, "La precipitación en las proximidades se cifra VCSH.", "Proximidad"],
 ["¿Existe este grupo de tiempo presente?", "FZSN", ["Sí, existe", "No existe"], 1, "FZ solo va con FG, DZ y RA: la nieve ya cae congelada.", "Descriptores"],
 ["¿Existe este grupo de tiempo presente?", "SHDZ", ["Sí, existe", "No existe"], 1, "La llovizna nunca es chubasco: viene de nubes estratiformes.", "Descriptores"],
 ["¿Existe esta combinación?", "SN BLSN", ["Sí, existe", "No existe"], 0, "Nieva y además el viento levanta la nieve: son dos fenómenos.", "Combinaciones"],
 ["¿Existe esta combinación?", "BR FG", ["Sí, existe", "No existe"], 1, "Se excluyen por visibilidad: FG bajo 1000 m, BR de 1000 a 5000 m.", "Combinaciones"],
 ["¿Cuál de estos grupos está bien escrito?", null, ["-RA SN", "-RASN", "-RA -SN", "RASN-"], 1, "Las precipitaciones mezcladas van en un solo grupo, la dominante primero.", "Cómo se arma"],
 ["¿Cuál de estos lleva intensidad?", null, ["FG", "DRSN", "SHRA", "TS (sin precipitación)"], 2, "Solo la precipitación lleva intensidad (y DS, SS, FC).", "Intensidad"],
 ["Visibilidad 1500 m por gotitas en suspensión, HR 97 %. ¿Qué se informa?", null, ["FG", "BR", "HZ", "Nada"], 1, "Entre 1000 y 5000 m con aire húmedo: neblina (BR).", "Visibilidad"],
 ["Chubasco a la vista a unos 12 km; en la estación no llueve. En el METAR:", null, ["VCSH", "VCRA", "SHRA", "No se informa"], 0, "VC es entre 8 y 16 km; la precipitación cercana es VCSH.", "Proximidad"],
 ["Se oye un trueno ahora, sin lluvia en la estación. Llovió hasta hace 20 min. ¿ww?", null, ["21", "17", "29", "95"], 1, "La 17 tiene prioridad sobre las cifras 20 a 49.", "ww SYNOP"],
 ["Lluvia débil que paró hace 30 min; ahora nada. ¿Qué va en el METAR?", null, ["RERA", "-RA", "Nada (sin w'w' ni RE)", "RE-RA"], 2, "En el METAR, RE es solo para precipitación moderada o fuerte. En el SYNOP sí va ww 21.", "Tiempo reciente"],
 ["La tormenta terminó hace 20 min y sigue lluvia moderada. ¿ww?", null, ["63", "95", "92", "29"], 2, "Tormenta en la hora precedente con lluvia moderada ahora: 92.", "ww SYNOP"],
 ["Relámpagos lejanos toda la hora, sin ningún trueno. ¿Hay tormenta?", null, ["Sí: TS y ww 17", "Sí: VCTS", "No: ww 13 y nada en el METAR", "No: ww 29"], 2, "Sin trueno no hay tormenta. Relámpagos sin trueno: ww 13.", "Tormenta"],
 ["En un período hubo llovizna, lluvia y una tormenta. ¿W1 W2?", null, ["9 5", "6 5", "9 6", "9 8"], 2, "W1 y W2 son las dos cifras más altas: tormenta (9) y lluvia (6).", "W1 W2"],
 ["Tormenta moderada con lluvia fuerte. ¿Cómo va en el METAR?", null, ["TS +RA", "+TSRA", "TSRA+", "+TS RA"], 1, "Un solo grupo; el + es de la lluvia.", "Intensidad"],
];
const A = {nom: "", i: 0, r: Array(P.length).fill(null), t0: 0, t1: 0, tm: null};
const $ = s => document.querySelector(s), app = $("#app");
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mmss = ms => { const t = Math.round(ms / 1000); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`; };
const notaCL = (p, max) => { const e = 0.6 * max, n = p < e ? 1 + 3 * p / e : 4 + 3 * (p - e) / (max - e); return Math.round(Math.max(1, n) * 10) / 10; };
const nivel = f => f >= .9 ? "Experto" : f >= .75 ? "Avanzado" : f >= .6 ? "Competente" : f >= .4 ? "En formación" : "Inicial";

function inicio(){
  app.innerHTML = `<div class="card"><h2 style="margin-top:0">Antes de empezar</h2>
   <p>Son <b>${P.length} preguntas</b> sobre tiempo presente METAR y SYNOP. No es una evaluación con nota oficial: sirve para saber desde dónde partimos.</p>
   <p class="mu">Responda sin apuntes. Puede volver a una pregunta antes de terminar. Al final verá su resultado con la explicación de cada respuesta.</p>
   <label for="nom">Nombre completo</label><input type="text" id="nom" autocomplete="name">
   <label for="cur">Curso o grupo (opcional)</label><input type="text" id="cur">
   <div class="nav"><span class="mu" id="fal"></span><button class="btn or" id="go">Comenzar</button></div></div>`;
  try { $("#nom").value = localStorage.getItem("alumno_nombre") || ""; } catch (e) {}
  $("#go").onclick = () => { const n = $("#nom").value.trim(); if (!n){ $("#fal").textContent = "Escriba su nombre."; $("#nom").focus(); return; }
    A.nom = n; A.cur = $("#cur").value.trim(); try { localStorage.setItem("alumno_nombre", n); } catch (e) {}
    A.t0 = Date.now(); A.tm = setInterval(() => $("#tm").textContent = mmss(Date.now() - A.t0), 1000); pregunta(); };
}
function pregunta(){
  const [q, c, ops] = P[A.i], n = A.i + 1;
  app.innerHTML = `<div class="card"><div class="mu">Pregunta ${n} de ${P.length}</div><div class="prog"><i style="width:${100 * A.i / P.length}%"></i></div>
   <div class="q">${esc(q)}</div>${c ? `<div class="code">${esc(c)}</div>` : ""}
   ${ops.map((o, j) => `<button class="op ${A.r[A.i] === j ? "sel" : ""}" data-j="${j}">${esc(o)}</button>`).join("")}
   <div class="nav"><button class="btn sec" id="ant" ${A.i ? "" : "disabled"}>◀ Anterior</button>
   <button class="btn ${n === P.length ? "or" : ""}" id="sig" ${A.r[A.i] == null ? "disabled" : ""}>${n === P.length ? "Terminar" : "Siguiente ▶"}</button></div></div>`;
  app.querySelectorAll(".op").forEach(b => b.onclick = () => { A.r[A.i] = +b.dataset.j; pregunta(); });
  $("#ant").onclick = () => { A.i--; pregunta(); };
  $("#sig").onclick = () => { if (n === P.length){ const sin = A.r.filter(x => x == null).length; if (sin && !confirm(`Le faltan ${sin} pregunta(s). ¿Terminar igual?`)) return; fin(); } else { A.i++; pregunta(); } };
}
async function fin(){
  clearInterval(A.tm); A.t1 = Date.now();
  const ok = P.map((p, i) => A.r[i] === p[3]), pts = ok.filter(Boolean).length, f = pts / P.length, nota = notaCL(pts, P.length);
  const temas = {}; P.forEach((p, i) => { const t = p[5]; temas[t] = temas[t] || [0, 0]; temas[t][1]++; if (ok[i]) temas[t][0]++; });
  const debiles = Object.entries(temas).filter(([, [a, b]]) => a / b < 0.6).map(([t]) => t);
  app.innerHTML = `<div class="card"><h2 style="margin-top:0">Resultado</h2>
   <div class="res"><div><div class="mu">Correctas</div><div class="big">${pts}/${P.length}</div></div><div><div class="mu">Nota</div><div class="big">${nota.toFixed(1).replace(".", ",")}</div></div>
   <div><div class="mu">Nivel</div><div class="big" style="font-size:22px">${nivel(f)}</div></div><div><div class="mu">Tiempo</div><div class="big">${mmss(A.t1 - A.t0)}</div></div></div>
   ${debiles.length ? `<p><b>Para reforzar:</b> ${debiles.map(esc).join(" · ")}</p>` : `<p><b>Muy bien:</b> no hay temas bajo 60 %.</p>`}
   <p class="estado" id="estado">Enviando el resultado al docente…</p></div>
   <div class="card"><h3 style="margin-top:0">Revise cada respuesta</h3>${P.map((p, i) => `<div class="it"><div><b>${i + 1}.</b> ${esc(p[0])} ${p[1] ? `<code>${esc(p[1])}</code>` : ""}</div>
     <div>${ok[i] ? `<span class="ok">✔ Correcta:</span> ${esc(p[2][p[3]])}` : `<span class="bad">✖ Su respuesta:</span> ${A.r[i] == null ? "(sin responder)" : esc(p[2][A.r[i]])} · <b>Correcta:</b> ${esc(p[2][p[3]])}`}</div>
     <div class="mu">${esc(p[4])}</div></div>`).join("")}</div>`;
  const r = await enviarResultado({prueba: "diagnostico", nombre: A.nom, curso: A.cur, inicio: new Date(A.t0).toISOString(), fin: new Date(A.t1).toISOString(),
    duracion_s: Math.round((A.t1 - A.t0) / 1000), puntaje: pts, max: P.length, nota, nivel: nivel(f),
    detalle: P.map((p, i) => ({n: i + 1, tema: p[5], pregunta: p[0] + (p[1] ? " " + p[1] : ""), respuesta: A.r[i] == null ? null : p[2][A.r[i]], correcta: p[2][p[3]], ok: ok[i]}))});
  $("#estado").innerHTML = r.ok ? "✔ Resultado enviado al docente." : `⚠ No se pudo enviar ahora (${esc(r.error || "sin conexión")}). Quedó guardado en este navegador y se reenviará al volver a abrir la página.`;
}
inicio();
</script>
<style>#volver{position:fixed;right:10px;top:4px;z-index:900;background:#fff;border:1px solid #9fb2c9;border-radius:14px;padding:3px 11px;font:12.5px "Segoe UI",Tahoma,Arial,sans-serif;color:#2f64b0;text-decoration:none;box-shadow:0 2px 6px rgba(0,0,0,.12)}#volver:hover{background:#eef4fc}@media print{#volver,#idChip{display:none}}</style><a id="volver" href="index.html">&larr; Volver al curso</a><script>if (location.protocol === "file:") document.getElementById("volver").href = "https://metotec.cl/";</script>
</body>
</html>
