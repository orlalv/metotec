name: Caso Yumbel (temporal)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: datos
          path: datos
          sparse-checkout: |
            estaciones.json
            ema/2026/11/21
            ema/2026/11/22
            ema/2026/11/23
            ema/2026/11/24
            ext/pp/2026/11
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pandas numpy requests pillow netCDF4
      - run: python qc/caso_yumbel.py --datos datos --salida informes/caso_yumbel.json || true
        shell: bash
      - run: |
          mkdir -p informes; ls -la informes
          git config user.name "metotec-bot"; git config user.email "bot@metotec"
          git add informes/caso_yumbel.json && git commit -m "caso Yumbel: datos" && git pull --rebase -q && git push
