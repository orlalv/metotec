name: Sondeo temporal revisiones
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          python3 - <<'P'
          import os, json, collections, urllib.request, urllib.parse
          A, T = os.environ['CLOUDFLARE_ACCOUNT_ID'], os.environ['CLOUDFLARE_API_TOKEN']
          B = f"https://api.cloudflare.com/client/v4/accounts/{A}/storage/kv/namespaces/0d6aa4b37a834b5983ac9c7f638e2dbb"
          g = lambda u: json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"Authorization": "Bearer " + T})))
          ks = []; cur = None
          for pre in ("qc/rev/", "qc/informados", "qc/hist"):
              cur = None
              while True:
                  r = g(B + "/keys?prefix=" + urllib.parse.quote(pre) + ("&cursor=" + cur if cur else ""))
                  ks += [k["name"] for k in r["result"]]
                  cur = r.get("result_info", {}).get("cursor")
                  if not cur: break
          print("R claves", len(ks), ks[:5], ks[-5:])
          C = collections.Counter(); CR = collections.defaultdict(collections.Counter); n = 0
          for k in [x for x in ks if x.startswith("qc/rev/")]:
              try: D = g(B + "/values/" + urllib.parse.quote(k, safe=""))
              except Exception as e: print("R err", k, e); continue
              it = D.values() if isinstance(D, dict) else D
              for m in it:
                  if not isinstance(m, dict): continue
                  n += 1; v = m.get("v"); C[v] += 1
                  rid = m.get("regla") or m.get("prueba") or (m.get("id") or "").split("|")[1:2] and (m.get("id") or "").split("|")[1] or "?"
                  CR[str(rid)[:12]][v] += 1
              if n < 3: print("R muestra", k, json.dumps(D, ensure_ascii=False)[:400])
          print("R total marcas", n, dict(C))
          for r, c in sorted(CR.items(), key=lambda x: -sum(x[1].values()))[:40]: print("R regla", r, dict(c))
          P
