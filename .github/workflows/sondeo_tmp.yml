name: Sondeo temporal agua caida
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    env:
      DMC_USUARIO: ${{ secrets.DMC_USUARIO }}
      DMC_TOKEN: ${{ secrets.DMC_TOKEN }}
    steps:
      - run: |
          python3 - <<'P'
          import os, json, urllib.request, urllib.parse
          q = urllib.parse.urlencode({"usuario": os.environ["DMC_USUARIO"], "token": os.environ["DMC_TOKEN"]})
          for c in ("270008",):
              j = json.load(urllib.request.urlopen(f"https://climatologia.meteochile.gob.cl/application/serviciosb/getAguaCaidaDiaria/{c}?{q}", timeout=300))
              print("== estacion", json.dumps(j.get("datosEstacion"), ensure_ascii=False))
              D = (j.get("datosHistoricos") or {}).get("diaria") or {}
              print("años", list(D)[:3], "...", list(D)[-3:], len(D))
              import collections
              for a in list(D)[-2:]:
                  m = D[a]; print("año", a, "meses", list(m))
                  for mm in list(m)[:2]:
                      print("  mes", mm, json.dumps({k: m[mm][k] for k in list(m[mm])[:5]}))
              # resumen: días con parcial != total, días sin dato, trazas, máximos
              n = vac = dif = tra = 0; mx = (0, None)
              for a, M in D.items():
                  for mm, Dd in M.items():
                      for d, v in Dd.items():
                          n += 1
                          p, t, z = v.get("parcial"), v.get("total"), v.get("traza")
                          if p is None and t is None: vac += 1
                          if p is not None and t is not None and p != t: dif += 1
                          if z: tra += 1
                          if isinstance(t, (int, float)) and t > mx[0]: mx = (t, f"{a}-{mm}-{d}")
              print("dias", n, "vacios", vac, "parcial!=total", dif, "con traza", tra, "max total", mx)
              ej = [(a, mm, d, v) for a, M in D.items() for mm, Dd in M.items() for d, v in Dd.items() if v.get("parcial") != v.get("total")][:8]
              print("ejemplos parcial!=total", ej)
          P
