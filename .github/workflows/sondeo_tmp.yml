name: Sondeo temporal resumen diario
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    env:
      DMC_USUARIO: ${{ secrets.DMC_USUARIO }}
      DMC_TOKEN: ${{ secrets.DMC_TOKEN }}
    steps:
      - run: |
          python3 - <<'P'
          import os, json, urllib.request, urllib.parse
          q = urllib.parse.urlencode({"usuario": os.environ["DMC_USUARIO"], "token": os.environ["DMC_TOKEN"]})
          for c in ("410005", "550001", "390006", "180005", "450005", "360019"):
              j = json.load(urllib.request.urlopen(f"https://climatologia.meteochile.gob.cl/application/servicios/getEmaResumenDiario/{c}?{q}", timeout=120))
              d = j.get("datos", {})
              te = d.get("temperaturaExtremas", {})
              print("==", c, json.dumps({k: te[k] for k in list(te)[-3:]}, ensure_ascii=False))
              print("   6h", json.dumps(d.get("extremas6Horas"), ensure_ascii=False)[:600])
          P
