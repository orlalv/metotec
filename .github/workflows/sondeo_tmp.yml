name: Sondeo temporal super2
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          python3 - <<'P'
          import os, json, collections, urllib.request
          u = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/storage/kv/namespaces/0d6aa4b37a834b5983ac9c7f638e2dbb/values/qc/super"
          D = json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]})))
          print("R gen", D["generado"], "errores", D.get("errores"))
          print("R obs_esp", len(D.get("obs_esp", [])), sum(len(e["hallazgos"]) for e in D.get("obs_esp", [])))
          print("R bol", sum(1 for e in D["estaciones"] if e.get("bol")), [e["bol"] for e in D["estaciones"] if e.get("bol")][:2])
          print("R reglas", collections.Counter(h["regla"] for e in D["estaciones"] for h in e["hallazgos"]).most_common())
          P
