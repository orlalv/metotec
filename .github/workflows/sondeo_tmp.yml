name: Sondeo temporal pagina
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'P'
          import os, json, urllib.request
          def kv(k):
              u = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/storage/kv/namespaces/0d6aa4b37a834b5983ac9c7f638e2dbb/values/{k}"
              try: return json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]})).read())
              except Exception: return None
          r = kv("qc/ultimo"); r["observaciones"] = kv("qc/sensorial"); r["super"] = kv("qc/super"); r["marcas"] = {}; r["informados"] = kv("qc/informados") or {}
          json.dump(r, open("/tmp/qc.json", "w"))
          P
          npm i playwright@1.47.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
          (python3 -m http.server 8765 >/dev/null 2>&1 &); sleep 1
          cat > /tmp/t.js <<'J'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');const fs=require('fs');(async()=>{const b=await chromium.launch();const p=await b.newPage();
          await p.addInitScript(()=>{try{localStorage.setItem('qcClave','x');sessionStorage.setItem('qcClave','x')}catch(e){}});
          await p.route('**/api/qc',r=>r.fulfill({body:fs.readFileSync('/tmp/qc.json'),contentType:'application/json'}));
          p.on('pageerror',e=>console.log('PAGEERR',e.message,(e.stack||'').split('\n').slice(1,3).join(' | ')));
          for (const h of ['#ema','#sup','#obs']){ await p.goto('http://localhost:8765/qc.html'+h);await p.waitForTimeout(6000);
            console.log('RES',h,(await p.$$eval('.it',x=>x.length)), (await p.textContent('#lista').catch(()=>'')).slice(0,120).replace(/\s+/g,' ')); }
          await b.close();})();
          J
          node /tmp/t.js
