name: Sondeo temporal six2
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          python3 - <<'P'
          import os, json, urllib.request
          u = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/storage/kv/namespaces/0d6aa4b37a834b5983ac9c7f638e2dbb/values/qc/super"
          D = json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]})))
          print("R gen", D["generado"], "errores", str(D.get("errores"))[:300])
          for e in D["estaciones"] + D.get("obs_esp", []):
              for h in e["hallazgos"]:
                  if h["regla"] == "ZK01": print("R", e["nombre"][:28], h.get("sigma"), h["msg"][:140])
          P
