name: Sondeo temporal kv
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          python3 - <<'P'
          import os, json, urllib.request
          for k in ("qc/ultimo", "qc/super", "qc/sensorial"):
              u = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/storage/kv/namespaces/0d6aa4b37a834b5983ac9c7f638e2dbb/values/{k}"
              try:
                  t = urllib.request.urlopen(urllib.request.Request(u, headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]})).read()
                  D = json.loads(t); print("KV", k, len(t), D.get("generado"), len(D.get("estaciones", [])), str(D.get("errores"))[:300])
              except Exception as e: print("KV", k, "ERR", e)
          P
