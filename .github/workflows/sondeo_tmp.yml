name: Sondeo temporal six
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          python3 - <<'P'
          import os, json, collections, urllib.request
          u = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/storage/kv/namespaces/0d6aa4b37a834b5983ac9c7f638e2dbb/values/qc/super"
          D = json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]})))
          print("R gen", D["generado"], "errores", str(D.get("errores"))[:600])
          L = [(e["nombre"], h) for e in D["estaciones"] + D.get("obs_esp", []) for h in e["hallazgos"]]
          print("R reglas", collections.Counter(h["regla"] for _, h in L).most_common())
          for n, h in L:
              if h["regla"] in ("ZK01", "ZC08", "ZC09", "ZC10"): print("R", h["regla"], n[:22], h["msg"][:150])
          P
