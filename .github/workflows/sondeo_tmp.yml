name: Sondeo temporal kv2
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          python3 - <<'P'
          import os, json, urllib.request
          r = {}
          def kv(k):
              u = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/storage/kv/namespaces/0d6aa4b37a834b5983ac9c7f638e2dbb/values/{k}"
              try: return json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]})).read())
              except Exception: return None
          r = kv("qc/ultimo"); r["observaciones"] = kv("qc/sensorial"); r["super"] = kv("qc/super"); r["marcas"] = {}; r["informados"] = kv("qc/informados") or {}
          json.dump(r, open("qc.json", "w"))
          P
      - uses: actions/upload-artifact@v4
        with: {name: qc, path: qc.json}
