name: Sondeo temporal super
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          python3 - <<'P'
          import os, json, collections, urllib.request
          u = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/storage/kv/namespaces/0d6aa4b37a834b5983ac9c7f638e2dbb/values/qc/super"
          D = json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]})))
          print("TIPO", type(D).__name__, list(D.keys())[:20] if isinstance(D, dict) else len(D))
          s = json.dumps(D)[:1500]; print("MUESTRA", s)
          def recorre(x, c):
              if isinstance(x, dict):
                  r = x.get("regla") or x.get("prueba") or x.get("codigo_regla")
                  if r and ("msg" in x or "detalle" in x): c[str(r)] += 1
                  for v in x.values(): recorre(v, c)
              elif isinstance(x, list):
                  for v in x: recorre(v, c)
          c = collections.Counter(); recorre(D, c); print("REGLAS", c.most_common(60))
          P
