name: Sondeo temporal agua caida
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    env:
      DMC_USUARIO: ${{ secrets.DMC_USUARIO }}
      DMC_TOKEN: ${{ secrets.DMC_TOKEN }}
    steps:
      - run: |
          python3 - <<'P'
          import os, json, urllib.request, urllib.parse
          q = urllib.parse.urlencode({"usuario": os.environ["DMC_USUARIO"], "token": os.environ["DMC_TOKEN"]})
          j = json.load(urllib.request.urlopen(f"https://climatologia.meteochile.gob.cl/application/servicios/getAguaCaidaDiaria/270008?{q}", timeout=180))
          def corta(x, n=0):
              if isinstance(x, dict): return {k: corta(v, n + 1) for k, v in list(x.items())[:6]} | ({"...": f"{len(x)} claves"} if len(x) > 6 else {})
              if isinstance(x, list): return [corta(v, n + 1) for v in x[:3]] + ([f"... {len(x)} elementos"] if len(x) > 3 else [])
              return x
          print(json.dumps(corta(j), ensure_ascii=False, indent=1)[:6000])
          P
