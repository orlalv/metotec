name: Sondeo temporal jardin
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          python3 - <<'P'
          import os, json, urllib.request
          def kv(k):
              u = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/storage/kv/namespaces/0d6aa4b37a834b5983ac9c7f638e2dbb/values/{k}"
              return json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]})))
          for k in ("qc/ultimo", "qc/super"):
              D = kv(k)
              for e in D["estaciones"]:
                  if "jard" in e["nombre"].lower():
                      print("==", k, e["codigo"], e["nombre"])
                      print("  res", {x: e.get("res", {}).get(x) for x in ("T", "Tn12", "Tx12", "Tmin24", "Tmax24")} if "res" in e else "")
                      print("  ult", {x: (e.get("ultimo") or e.get("valores") or {}).get(x) for x in ("T","Tn12","Tx12")})
                      for a in (e.get("alertas") or e.get("hallazgos") or []): print("  AL", json.dumps(a, ensure_ascii=False)[:250])
                      print("  claves", list(e.keys()))
          P
