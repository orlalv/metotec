# Compendio Agro semanal (jueves a miércoles) con los boletines regionales de climatología.
# Corre los jueves a las 09:13 y 10:43 hora de Chile (12:13 y 13:43 UTC): el boletín pluviométrico del miércoles se cierra el jueves a las 8:00.
# A mano: Actions → «Compendio Agro» → Run workflow (opcional: jueves de inicio AAAA-MM-DD).
name: Compendio Agro
on:
  schedule:
    - cron: "13 12 * * 4"
    - cron: "43 13 * * 4"
  workflow_dispatch:
    inputs:
      semana:
        description: "Jueves de inicio (AAAA-MM-DD); vacío = la semana que terminó ayer"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: agro
  cancel-in-progress: false
jobs:
  agro:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KV_ID: 0d6aa4b37a834b5983ac9c7f638e2dbb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas numpy requests pillow
      - name: Rama de datos
        run: git clone -q --depth 1 --branch datos "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" datos
      - name: Compendio
        run: python qc/agro_boletin.py --datos datos --semana "${{ inputs.semana }}"
      - name: Guardar
        if: always()
        run: |
          cd datos
          git config user.name "qc-metotec"; git config user.email "contacto.metotec@gmail.com"
          git add agro && git commit -q -m "compendio agro $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase origin datos && git push -q origin datos && break; sleep 7; done
