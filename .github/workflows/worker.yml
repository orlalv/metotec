# Publica el Worker de «Mis alertas» (worker/): cron cada 5 minutos que lee la red EMA, evalúa las reglas del equipo
# y avisa por Telegram / correo. Requiere el plan Workers Paid y que CLOUDFLARE_API_TOKEN tenga permiso «Workers Scripts: Edit».
# Los secretos DMC_USUARIO, DMC_TOKEN, TELEGRAM_TOKEN, RESEND_API_KEY y RESEND_FROM del repositorio se copian al Worker.
name: Publicar Worker de alertas
on:
  push:
    branches: [main]
    paths: ["worker/**", "js/alertas_core.js", ".github/workflows/worker.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pruebas
        run: node --test worker/test/alertas.test.mjs
      - name: Publicar
        working-directory: worker
        run: npx -y wrangler@3 deploy
      - name: Secretos
        working-directory: worker
        env:
          DMC_USUARIO: ${{ secrets.DMC_USUARIO }}
          DMC_TOKEN: ${{ secrets.DMC_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: |
          python3 -c "import os,json; print(json.dumps({k: os.environ[k] for k in ['DMC_USUARIO','DMC_TOKEN','TELEGRAM_TOKEN','RESEND_API_KEY','RESEND_FROM'] if os.environ.get(k)}))" > "$RUNNER_TEMP/secretos.json"
          npx -y wrangler@3 secret:bulk "$RUNNER_TEMP/secretos.json"
          rm -f "$RUNNER_TEMP/secretos.json"
