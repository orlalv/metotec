name: Pruebas fijas
on:
  push:
    paths: ["qc/**"]
  workflow_dispatch:
jobs:
  casos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas numpy requests
      - run: python qc/casos.py
