name: Explorar SACLIM
on: workflow_dispatch
jobs:
  e:
    runs-on: ubuntu-latest
    env:
      DMC_USUARIO: ${{ secrets.DMC_USUARIO }}
      DMC_TOKEN: ${{ secrets.DMC_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests pandas
      - run: |
          cd qc && python - <<'PY'
          import dmc, json
          vistos = {}
          for cod in ["290004", "330020", "410005", "380029", "450001", "520006", "330030", "360011"]:
              try: js = dmc.descargar(f"getRecientesSaclim/{cod}", timeout=90)
              except Exception as e: print(cod, e); continue
              nombres = {k: v.get("elementoNombreCorto") for k, v in (js.get("datosElementos") or {}).items()}
              for b in (js.get("datosRecientes") or {}, *(js.get("datos") or [])):
                  for t, h in (b or {}).items():
                      for eid, lin in ((h or {}).get("datos") or {}).items():
                          if nombres.get(eid) not in ("WWMETAR", "WWSINOP", "W1W2"): continue
                          for comps in (lin or {}).values():
                              for cn, c in (comps or {}).items():
                                  if c.get("valor") not in (None, ""):
                                      vistos[(nombres[eid], cn, str(c.get("valor")))] = c.get("valorDescripcion")
          for k in sorted(vistos): print(k, "→", vistos[k])
          PY
