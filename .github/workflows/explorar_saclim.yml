name: Explorar SACLIM
on: workflow_dispatch
jobs:
  e:
    runs-on: ubuntu-latest
    env:
      CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          for d in 92435031-aa42-4077-bf1b-4a14f2c1879f; do
          curl -s -H "Authorization: Bearer $CF" "https://api.cloudflare.com/client/v4/accounts/$AC/pages/projects/metotec/deployments/$d" | python3 -c "
          import json,sys;d=json.load(sys.stdin);r=d.get('result') or {}
          print({k:r.get(k) for k in ('id','url','aliases','environment','is_skipped','production_branch','short_id')})
          print([ (s['name'],s['status']) for s in r.get('stages',[])])"
          done
          for h in metotec.cl metotec.pages.dev; do echo == $h; curl -s -o /dev/null -w "%{http_code} %{size_download}\n" "https://$h/js/minutarios.js?z=$RANDOM"; curl -s "https://$h/js/minutarios.js?z=$RANDOM" | grep -c "Subir archivos"; done
