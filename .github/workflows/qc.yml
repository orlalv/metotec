# Control de calidad en vivo: cada 30 minutos descarga la red automática de la DMC,
# guarda los datos minutarios en la rama "datos" y sube las alertas al KV de Cloudflare.
name: Control de calidad
on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:
    inputs:
      sensorial:
        description: "Revisar observaciones (auto = solo entre los minutos 10 y 29)"
        default: "auto"
      boletin:
        description: "Revisar el boletín climatológico diario (auto = entre 07:00 y 13:00 hora local)"
        default: "auto"
permissions:
  contents: write
concurrency:
  group: qc
  cancel-in-progress: false
jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DMC_USUARIO: ${{ secrets.DMC_USUARIO }}
      DMC_TOKEN: ${{ secrets.DMC_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KV_ID: 0d6aa4b37a834b5983ac9c7f638e2dbb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas numpy requests
      - name: Rama de datos
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          if git ls-remote --exit-code --heads origin datos >/dev/null; then
            git clone -q --depth 1 --branch datos "$URL" datos
          else
            mkdir datos && cd datos && git init -q -b datos && git remote add origin "$URL"
          fi
      - name: Control de calidad
        run: python qc/correr.py --datos datos --salida qc_ultimo.json --sensorial ${{ inputs.sensorial || 'auto' }} --boletin ${{ inputs.boletin || 'auto' }}
      - name: Guardar datos
        if: always()
        run: |
          cd datos
          git config user.name "qc-metotec"
          git config user.email "contacto.metotec@gmail.com"
          git add -A
          git commit -q -m "datos $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push -q origin datos

  # Cadena: el cron de GitHub es poco confiable, así que cada ejecución deja lanzada la siguiente (minutos :15 y :45).
  siguiente:
    needs: qc
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: write
    steps:
      - name: Esperar y lanzar la próxima (atendiendo los pedidos de «Revisar ahora»)
        env:
          GH_TOKEN: ${{ github.token }}
          CF_TOK: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_ID: 0d6aa4b37a834b5983ac9c7f638e2dbb
        run: |
          ahora=$(date +%s)
          objetivo=$(( (ahora / 1800 + 1) * 1800 + 900 ))
          if [ $(( objetivo - ahora )) -gt 1800 ]; then objetivo=$(( objetivo - 1800 )); fi
          if [ $(( objetivo - ahora )) -lt 120 ]; then objetivo=$(( objetivo + 1800 )); fi
          KV="https://api.cloudflare.com/client/v4/accounts/$CF_ACC/storage/kv/namespaces/$KV_ID/values/qc/pedidos"
          echo "Esperando hasta $(date -u -d @$objetivo +%H:%M) UTC"
          while [ $(date +%s) -lt $objetivo ]; do
            p=$(curl -s -f -H "Authorization: Bearer $CF_TOK" "$KV" || true)
            cods=$(echo "$p" | python3 -c "import sys,json
          try: print(','.join(json.load(sys.stdin).keys()))
          except Exception: pass")
            if [ -n "$cods" ]; then
              echo "Pedido: $cods"
              curl -s -X DELETE -H "Authorization: Bearer $CF_TOK" "$KV" >/dev/null
              gh workflow run revisar.yml -R "$GITHUB_REPOSITORY" --ref main -f cods="$cods" || true
            fi
            KVP="https://api.cloudflare.com/client/v4/accounts/$CF_ACC/storage/kv/namespaces/$KV_ID/values/qc/pedidos_periodo"
            pp=$(curl -s -f -H "Authorization: Bearer $CF_TOK" "$KVP" || true)
            if [ -n "$pp" ] && [ "$pp" != "{}" ]; then
              curl -s -X DELETE -H "Authorization: Bearer $CF_TOK" "$KVP" >/dev/null
              echo "$pp" | python3 -c "import sys,json
          for x in json.load(sys.stdin).values(): print(json.dumps(x))" | while read -r ped; do
                echo "Período: $ped"
                gh workflow run periodo.yml -R "$GITHUB_REPOSITORY" --ref main -f pedido="$ped" || true
              done
            fi
            sleep 30
          done
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w qc.yml --json status -q '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting")] | length')
          if [ "$n" != "0" ]; then echo "Ya hay una en cola."; exit 0; fi
          gh workflow run qc.yml -R "$GITHUB_REPOSITORY" --ref main
