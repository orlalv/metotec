# Control de calidad en vivo: cada 30 minutos descarga la red automática de la DMC,
# guarda los datos minutarios en la rama "datos" y sube las alertas al KV de Cloudflare.
name: Control de calidad
on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:
    inputs:
      sensorial:
        description: "Revisar observaciones (auto = solo entre los minutos 10 y 29)"
        default: "auto"
permissions:
  contents: write
concurrency:
  group: qc
  cancel-in-progress: false
jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DMC_USUARIO: ${{ secrets.DMC_USUARIO }}
      DMC_TOKEN: ${{ secrets.DMC_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KV_ID: 0d6aa4b37a834b5983ac9c7f638e2dbb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas numpy requests
      - name: Rama de datos
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          if git ls-remote --exit-code --heads origin datos >/dev/null; then
            git clone -q --depth 1 --branch datos "$URL" datos
          else
            mkdir datos && cd datos && git init -q -b datos && git remote add origin "$URL"
          fi
      - name: Control de calidad
        run: python qc/correr.py --datos datos --salida qc_ultimo.json --sensorial ${{ inputs.sensorial || 'auto' }}
      - name: Guardar datos
        if: always()
        run: |
          cd datos
          git config user.name "qc-metotec"
          git config user.email "contacto.metotec@gmail.com"
          git add -A
          git commit -q -m "datos $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push -q origin datos

  # Cadena: el cron de GitHub es poco confiable, así que cada ejecución deja lanzada la siguiente (minutos :15 y :45).
  siguiente:
    needs: qc
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: write
    steps:
      - name: Esperar y lanzar la próxima
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ahora=$(date +%s)
          objetivo=$(( (ahora / 1800 + 1) * 1800 + 900 ))
          if [ $(( objetivo - ahora )) -gt 1800 ]; then objetivo=$(( objetivo - 1800 )); fi
          if [ $(( objetivo - ahora )) -lt 120 ]; then objetivo=$(( objetivo + 1800 )); fi
          espera=$(( objetivo - ahora ))
          echo "Esperando $espera s"; sleep $espera
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w qc.yml --json status -q '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting")] | length')
          if [ "$n" != "0" ]; then echo "Ya hay una en cola."; exit 0; fi
          gh workflow run qc.yml -R "$GITHUB_REPOSITORY" --ref main
