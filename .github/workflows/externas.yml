name: Estaciones externas (INIA y otras)
on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
permissions:
  contents: read
concurrency:
  group: externas
  cancel-in-progress: false
jobs:
  externas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KV_ID: 0d6aa4b37a834b5983ac9c7f638e2dbb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - run: python qc/externas.py
