name: GOES histórico
on:
  workflow_dispatch:
    inputs:
      pedido:
        description: "JSON {id, cod, lat, lon, t, prod}"
        required: true
permissions:
  contents: read
concurrency:
  group: goes-${{ github.run_id }}
jobs:
  goes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KV_ID: 0d6aa4b37a834b5983ac9c7f638e2dbb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy netCDF4 pillow requests
      - name: Generar imagen
        env:
          PEDIDO: ${{ inputs.pedido }}
        run: python qc/goes_hist.py --pedido "$PEDIDO"
