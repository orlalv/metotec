# Diagnóstico a mano: qué datos de NASA (GIBS, GES DISC) y GOES (AWS) se pueden leer desde GitHub Actions. Solo lectura.
name: Diagnóstico NASA
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests pillow
      - name: Probar accesos
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python qc/diag_nasa.py
